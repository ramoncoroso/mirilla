<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirilla</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Los textos se rellenan desde _locales con data-i18n (ver main.ts). -->
    <main>
      <h1 data-i18n="optionsTitle"></h1>
      <section id="trusted-box">
        <h2 data-i18n="trustedTitle"></h2>
        <p class="help" data-i18n="trustedHelp"></p>
        <form id="trusted-form">
          <input id="trusted-input" type="text" autocomplete="off" spellcheck="false" />
          <button class="qr-btn qr-btn-primary" type="submit" data-i18n="trustedAdd"></button>
        </form>
        <p id="trusted-status" class="status" role="status"></p>
        <ul id="trusted-list"></ul>
      </section>
      <section id="blocklist-box">
        <h2 data-i18n="blocklistTitle"></h2>
        <label class="check"><input id="blocklist-enabled" type="checkbox" /> <span data-i18n="settingBlocklist"></span></label>
        <p class="help" data-i18n="blocklistHelp"></p>
        <p id="blocklist-status" class="status"></p>
      </section>
      <section id="links-box">
        <h2 data-i18n="linksTitle"></h2>
        <label class="check"><input id="clean-links" type="checkbox" /> <span data-i18n="settingCleanLinks"></span></label>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
