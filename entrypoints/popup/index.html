<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirilla</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Los textos se rellenan desde _locales con data-i18n (ver main.ts). -->
    <main>
      <div class="scan-actions">
        <button id="select" class="qr-btn qr-btn-primary big" type="button">
          <span data-i18n="popupSelect"></span> <kbd id="shortcut"></kbd>
        </button>
        <button id="scan" class="qr-btn big" type="button" data-i18n="popupScan"></button>
        <button id="generate" class="qr-btn big" type="button" data-i18n="popupGenerate"></button>
      </div>

      <label id="drop" class="drop" tabindex="0" role="button">
        <input id="file" type="file" accept="image/*" hidden />
        <span data-i18n="popupDrop"></span> <u data-i18n="popupDropLink"></u>
      </label>

      <p id="status" class="status" role="status" hidden></p>
      <div id="results"></div>

      <details id="history-box">
        <summary data-i18n="popupHistory"></summary>
        <ul id="history"></ul>
        <div class="history-foot">
          <label><input id="history-enabled" type="checkbox" /> <span data-i18n="historySave"></span></label>
          <button id="history-clear" class="linkish" type="button" data-i18n="historyClear"></button>
        </div>
      </details>
    </main>
    <footer><span data-i18n="popupFooter"></span> <button id="settings" class="linkish" type="button" data-i18n="popupSettings"></button></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
