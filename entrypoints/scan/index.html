<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirilla</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Los textos se rellenan desde _locales con data-i18n (ver main.ts). -->
    <main>
      <h1 data-i18n="scanTitle"></h1>
      <div class="sources">
        <button id="camera" class="qr-btn big" type="button" data-i18n="scanCamera"></button>
        <button id="screen" class="qr-btn big" type="button" data-i18n="scanScreen"></button>
        <label id="pdf" class="qr-btn big" tabindex="0" role="button">
          <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden /> <span data-i18n="scanPdf"></span>
        </label>
      </div>
      <p class="help" data-i18n="scanPdfHelp"></p>
      <p class="help" data-i18n="scanPrivacy"></p>

      <section id="live" hidden>
        <div class="live-head">
          <select id="camera-select" hidden></select>
          <button id="stop" class="qr-btn" type="button" data-i18n="scanStop"></button>
        </div>
        <video id="video" muted playsinline></video>
        <p id="live-status" class="status" role="status"></p>
      </section>

      <p id="status" class="status" role="status" hidden></p>
      <div id="results"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
