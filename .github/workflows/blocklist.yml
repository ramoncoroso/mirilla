# Lista pública de phishing de Mirilla: cada 6 h descarga Phishing.Database (MIT), filtra falsos positivos, la compacta,
# la firma (Ed25519) y la publica en GitHub Pages (https://ramoncoroso.github.io/mirilla/blocklist/).
# La clave privada está en el secreto BLOCKLIST_SIGNING_KEY; la pública va dentro de la extensión (lib/blocklist-store.ts).
name: blocklist

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generar y firmar la lista
        env:
          BLOCKLIST_SIGNING_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
        run: node scripts/build-blocklist.ts site/blocklist
      - name: Comprobar que nada de Tranco se publica
        run: test -z "$(find site -iname '*tranco*')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
